plugins {
    id 'com.android.application'
}

android {
    namespace 'ru.lanko.app'
    compileSdk 34

    defaultConfig {
        applicationId 'ru.lanko.app'
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Для простоты release собирается без обфускации.
            // Подпись настраивается в Android Studio (Build > Generate Signed Bundle/APK).
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.11.0'
}
